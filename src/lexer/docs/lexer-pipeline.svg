<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78dc3c"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="14" fill="#0d110c"/>
  <text x="30" y="42" fill="#78dc3c" font-size="20" font-weight="bold">🔤 LEXER</text>
  <text x="128" y="42" fill="#789173" font-size="13">fuente .hulk → Vec&lt;Token&gt;</text>
  <line x1="30" y1="56" x2="930" y2="56" stroke="#78dc3c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- entrada -->
  <rect x="30" y="90" width="150" height="76" rx="10" fill="#141a12" stroke="#4a5d45"/>
  <text x="105" y="118" fill="#d6ebd0" font-size="13" text-anchor="middle">fuente</text>
  <text x="105" y="140" fill="#ebc878" font-size="11" text-anchor="middle">let x = 42;</text>
  <text x="105" y="156" fill="#789173" font-size="10" text-anchor="middle">// comentario</text>

  <!-- escaneo logos -->
  <rect x="230" y="90" width="180" height="76" rx="10" fill="#12240e" stroke="#78dc3c"/>
  <text x="320" y="116" fill="#78dc3c" font-size="13" font-weight="bold" text-anchor="middle">escaneo logos</text>
  <text x="320" y="136" fill="#a0c896" font-size="10" text-anchor="middle">skip espacios + // …</text>
  <text x="320" y="152" fill="#a0c896" font-size="10" text-anchor="middle">keywords priority=3</text>

  <!-- clasificacion -->
  <rect x="460" y="90" width="180" height="76" rx="10" fill="#12240e" stroke="#78dc3c"/>
  <text x="550" y="116" fill="#78dc3c" font-size="13" font-weight="bold" text-anchor="middle">clasificación</text>
  <text x="550" y="136" fill="#a0c896" font-size="10" text-anchor="middle">64 TokenKind</text>
  <text x="550" y="152" fill="#a0c896" font-size="10" text-anchor="middle">escapes \n \t \" en strings</text>

  <!-- salida -->
  <rect x="690" y="90" width="240" height="76" rx="10" fill="#141a12" stroke="#4a5d45"/>
  <text x="810" y="114" fill="#d6ebd0" font-size="13" text-anchor="middle">Vec&lt;Token&gt; + EOF</text>
  <text x="810" y="134" fill="#be82ff" font-size="10" text-anchor="middle">Let · Ident(x) · Assign · Number(42)</text>
  <text x="810" y="152" fill="#789173" font-size="10" text-anchor="middle">cada uno con línea:col y span</text>

  <line x1="180" y1="128" x2="222" y2="128" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="128" x2="452" y2="128" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="128" x2="682" y2="128" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- carril de recuperación -->
  <rect x="230" y="220" width="410" height="90" rx="10" fill="#241012" stroke="#ff5c5c" stroke-dasharray="5 4"/>
  <text x="435" y="246" fill="#ff5c5c" font-size="13" font-weight="bold" text-anchor="middle">recuperación de errores (no aborta)</text>
  <text x="435" y="268" fill="#e0a0a0" font-size="11" text-anchor="middle">carácter inesperado · escape inválido · 123abc</text>
  <text x="435" y="288" fill="#e0a0a0" font-size="11" text-anchor="middle">→ CompilerError + token Unknown de continuidad</text>

  <line x1="320" y1="166" x2="320" y2="212" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M 640 265 C 750 265 810 220 810 174" stroke="#ff5c5c" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="760" y="248" fill="#ff5c5c" font-size="10">Unknown sigue en el stream</text>

  <text x="30" y="340" fill="#789173" font-size="11">exit code 1 · el parser recibe el stream completo aunque haya errores → más diagnósticos por pasada</text>
</svg>
