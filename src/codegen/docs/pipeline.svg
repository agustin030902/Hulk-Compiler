<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc">
  <title id="title">LLVM Backend Pipeline</title>
  <desc id="desc">Pipeline modular de codegen LLVM: carga semántica, lowering de tipos, layouts, emisión de funciones/métodos/statements/expresiones y composición del módulo.</desc>

  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .card { fill: #ffffff; stroke: #1f2a44; stroke-width: 2; rx: 14; ry: 14; }
      .phase { fill: #e9f2ff; stroke: #2a5f99; stroke-width: 2; rx: 12; ry: 12; }
      .phase2 { fill: #ebfcef; stroke: #247a44; stroke-width: 2; rx: 12; ry: 12; }
      .phase3 { fill: #fff6e8; stroke: #a46308; stroke-width: 2; rx: 12; ry: 12; }
      .err { fill: #fdecec; stroke: #9f2d2d; stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #1f2a44; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #1f2a44; }
      .text { font: 500 15px 'Segoe UI', sans-serif; fill: #1f2a44; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #32425f; }
      .arrow { stroke: #1f2a44; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2a44" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1360" height="900" />
  <text class="title" x="44" y="58">Hulk Compiler: LLVM Backend Pipeline</text>
  <text class="small" x="44" y="86">Arquitectura modular en src/codegen/llvm/backend/*</text>

  <rect class="card" x="36" y="116" width="1288" height="742" />

  <rect class="phase" x="86" y="180" width="240" height="84" />
  <text class="subtitle" x="110" y="214">Input</text>
  <text class="text" x="110" y="240">Program AST</text>

  <rect class="phase" x="390" y="160" width="300" height="112" />
  <text class="subtitle" x="418" y="196">1) functions.rs</text>
  <text class="small" x="418" y="222">load_function_signatures</text>
  <text class="small" x="418" y="242">method_dispatch + FunctionInfo</text>

  <rect class="phase" x="390" y="302" width="300" height="108" />
  <text class="subtitle" x="418" y="338">2) type_lowering.rs</text>
  <text class="small" x="418" y="364">lower_semantic_type</text>
  <text class="small" x="418" y="384">semantic_type_from_type_id</text>

  <rect class="phase" x="390" y="440" width="300" height="110" />
  <text class="subtitle" x="418" y="476">3) layout.rs</text>
  <text class="small" x="418" y="502">load_struct_layouts</text>
  <text class="small" x="418" y="522">field_layout / StructLayout</text>

  <rect class="phase2" x="390" y="586" width="300" height="120" />
  <text class="subtitle" x="418" y="622">4) emit/*</text>
  <text class="small" x="418" y="648">function.rs / method.rs</text>
  <text class="small" x="418" y="668">statement.rs</text>
  <text class="small" x="418" y="688">expr/* (dispatch + handlers)</text>

  <rect class="phase3" x="752" y="214" width="520" height="412" />
  <text class="subtitle" x="780" y="250">LlvmBackend State (backend/mod.rs)</text>

  <rect class="card" x="780" y="274" width="220" height="92" />
  <text class="text" x="800" y="306">Scopes + temporals</text>
  <text class="small" x="800" y="328">scopes, temp/label counters</text>
  <text class="small" x="800" y="348">lookup/bind helpers</text>

  <rect class="card" x="1020" y="274" width="220" height="92" />
  <text class="text" x="1040" y="306">Type/function metadata</text>
  <text class="small" x="1040" y="328">functions, type_ids, type_decls</text>
  <text class="small" x="1040" y="348">struct_layouts, method_dispatch</text>

  <rect class="card" x="780" y="390" width="460" height="96" />
  <text class="text" x="800" y="422">Output buffers</text>
  <text class="small" x="800" y="444">global_lines, function_lines, body_lines</text>
  <text class="small" x="800" y="464">emit_global / emit_function_line / emit_body</text>

  <rect class="card" x="780" y="510" width="460" height="92" />
  <text class="text" x="800" y="542">Error channel</text>
  <text class="small" x="800" y="564">semantic_error -> Vec&lt;CompilerError&gt;</text>
  <text class="small" x="800" y="584">fail-fast en etapas críticas</text>

  <rect class="phase2" x="752" y="654" width="520" height="84" />
  <text class="subtitle" x="780" y="688">5) compose_module (helper/module_writer.rs)</text>
  <text class="text" x="780" y="714">LLVM IR final (declare + functions + main)</text>

  <rect class="err" x="86" y="740" width="604" height="86" />
  <text class="subtitle" x="114" y="774">Salida de generate()</text>
  <text class="text" x="114" y="800">Ok(String LLVM IR) o Err(Vec&lt;CompilerError&gt;)</text>

  <path class="arrow" d="M 326 222 L 390 216" />
  <path class="arrow" d="M 540 272 L 540 302" />
  <path class="arrow" d="M 540 410 L 540 440" />
  <path class="arrow" d="M 540 550 L 540 586" />

  <path class="arrow" d="M 690 216 L 752 240" />
  <path class="arrow" d="M 690 356 L 752 336" />
  <path class="arrow" d="M 690 496 L 752 454" />
  <path class="arrow" d="M 690 646 L 752 696" />

  <path class="arrow dashed" d="M 1012 738 L 690 782" />
  <path class="arrow" d="M 540 706 L 540 740" />
</svg>
