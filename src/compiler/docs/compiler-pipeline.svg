<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78dc3c"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5c5c"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="14" fill="#0d110c"/>
  <text x="30" y="42" fill="#78dc3c" font-size="20" font-weight="bold">🚂 COMPILER</text>
  <text x="185" y="42" fill="#789173" font-size="13">pipeline fail-fast · el programa se analiza UNA sola vez</text>
  <line x1="30" y1="56" x2="930" y2="56" stroke="#78dc3c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- fases -->
  <rect x="30" y="96" width="120" height="70" rx="10" fill="#12240e" stroke="#78dc3c"/>
  <text x="90" y="124" fill="#78dc3c" font-size="13" font-weight="bold" text-anchor="middle">🔤 lexer</text>
  <text x="90" y="146" fill="#a0c896" font-size="10" text-anchor="middle">tokens</text>

  <rect x="196" y="96" width="120" height="70" rx="10" fill="#12240e" stroke="#78dc3c"/>
  <text x="256" y="124" fill="#78dc3c" font-size="13" font-weight="bold" text-anchor="middle">🌳 parser</text>
  <text x="256" y="146" fill="#a0c896" font-size="10" text-anchor="middle">AST</text>

  <rect x="362" y="96" width="120" height="70" rx="10" fill="#241533" stroke="#be82ff"/>
  <text x="422" y="124" fill="#be82ff" font-size="12" font-weight="bold" text-anchor="middle">⚡ macros</text>
  <text x="422" y="146" fill="#c8b0e0" font-size="10" text-anchor="middle">AST plano</text>

  <rect x="528" y="96" width="120" height="70" rx="10" fill="#12240e" stroke="#78dc3c"/>
  <text x="588" y="124" fill="#78dc3c" font-size="13" font-weight="bold" text-anchor="middle">🧠 semantic</text>
  <text x="588" y="146" fill="#a0c896" font-size="10" text-anchor="middle">tablas + tipos</text>

  <rect x="694" y="96" width="120" height="70" rx="10" fill="#12240e" stroke="#78dc3c"/>
  <text x="754" y="124" fill="#78dc3c" font-size="13" font-weight="bold" text-anchor="middle">⚙️ codegen</text>
  <text x="754" y="146" fill="#a0c896" font-size="10" text-anchor="middle">LLVM IR</text>

  <rect x="850" y="96" width="80" height="70" rx="10" fill="#141a12" stroke="#ebc878"/>
  <text x="890" y="124" fill="#ebc878" font-size="12" font-weight="bold" text-anchor="middle">clang</text>
  <text x="890" y="146" fill="#a0c896" font-size="10" text-anchor="middle">./output</text>

  <line x1="150" y1="131" x2="188" y2="131" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="316" y1="131" x2="354" y2="131" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482" y1="131" x2="520" y2="131" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="648" y1="131" x2="686" y2="131" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="814" y1="131" x2="842" y2="131" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- flecha del analisis compartido -->
  <path d="M 588 166 C 588 210 754 210 754 170" stroke="#be82ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="671" y="222" fill="#be82ff" font-size="10" text-anchor="middle">generate(&amp;program, &amp;analyzer)</text>
  <text x="671" y="236" fill="#c8b0e0" font-size="9" text-anchor="middle">codegen consume el análisis, no lo repite</text>

  <!-- fail fast -->
  <rect x="30" y="270" width="900" height="90" rx="10" fill="#241012" stroke="#ff5c5c" stroke-dasharray="5 4"/>
  <text x="50" y="296" fill="#ff5c5c" font-size="13" font-weight="bold">fail-fast: la primera fase con errores corta el pipeline y escribe el diagnóstico</text>
  <text x="50" y="322" fill="#e0a0a0" font-size="12">lexer → exit 1 (LEXICAL) · parser → exit 2 (SYNTACTIC) · macros / semantic / codegen → exit 3 (SEMANTIC)</text>
  <text x="50" y="344" fill="#789173" font-size="10">formato en stderr: (línea,columna) CATEGORÍA: mensaje — el contrato que valida el corrector automático</text>

  <line x1="90" y1="166" x2="90" y2="262" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>
  <line x1="256" y1="166" x2="256" y2="262" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>
  <line x1="422" y1="166" x2="422" y2="262" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>
  <line x1="528" y1="166" x2="528" y2="262" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>
  <line x1="754" y1="166" x2="754" y2="262" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>

  <text x="30" y="398" fill="#789173" font-size="11">CompileReport expone tokens · AST · IR · errores de todas las fases alcanzadas — la CLI y la GUI consumen el mismo pipeline</text>
  <text x="30" y="418" fill="#789173" font-size="11">suite oficial: 115/115 ✔</text>
</svg>
