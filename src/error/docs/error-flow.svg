<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78dc3c"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="14" fill="#0d110c"/>
  <text x="30" y="42" fill="#78dc3c" font-size="20" font-weight="bold">🚨 ERROR</text>
  <text x="140" y="42" fill="#789173" font-size="13">un solo tipo de diagnóstico para todas las fases</text>
  <line x1="30" y1="56" x2="930" y2="56" stroke="#78dc3c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- fuentes -->
  <rect x="30" y="90" width="110" height="40" rx="8" fill="#10160f" stroke="#4a5d45"/>
  <text x="85" y="115" fill="#a0c896" font-size="11" text-anchor="middle">lexer</text>
  <rect x="30" y="140" width="110" height="40" rx="8" fill="#10160f" stroke="#4a5d45"/>
  <text x="85" y="165" fill="#a0c896" font-size="11" text-anchor="middle">parser</text>
  <rect x="30" y="190" width="110" height="40" rx="8" fill="#10160f" stroke="#4a5d45"/>
  <text x="85" y="215" fill="#a0c896" font-size="11" text-anchor="middle">semantic</text>
  <rect x="30" y="240" width="110" height="40" rx="8" fill="#10160f" stroke="#4a5d45"/>
  <text x="85" y="265" fill="#a0c896" font-size="11" text-anchor="middle">codegen</text>

  <!-- CompilerError -->
  <rect x="230" y="130" width="250" height="110" rx="10" fill="#12240e" stroke="#78dc3c"/>
  <text x="355" y="158" fill="#78dc3c" font-size="14" font-weight="bold" text-anchor="middle">CompilerError</text>
  <text x="355" y="182" fill="#a0c896" font-size="11" text-anchor="middle">category · message</text>
  <text x="355" y="200" fill="#a0c896" font-size="11" text-anchor="middle">line · column (desde Span)</text>
  <text x="355" y="224" fill="#789173" font-size="10" text-anchor="middle">se acumulan por pasada, no abortan</text>

  <line x1="140" y1="110" x2="222" y2="150" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="160" x2="222" y2="175" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="210" x2="222" y2="195" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="260" x2="222" y2="220" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- salidas -->
  <rect x="570" y="90" width="360" height="90" rx="10" fill="#141a12" stroke="#ebc878"/>
  <text x="750" y="116" fill="#ebc878" font-size="12" font-weight="bold" text-anchor="middle">Display → stderr</text>
  <text x="750" y="140" fill="#d6ebd0" font-size="11" text-anchor="middle">(línea,columna) CATEGORÍA: mensaje</text>
  <text x="750" y="162" fill="#789173" font-size="10" text-anchor="middle">(3,14) SEMANTIC: Function 'foo' is called before declaration.</text>

  <rect x="570" y="200" width="360" height="90" rx="10" fill="#141a12" stroke="#be82ff"/>
  <text x="750" y="226" fill="#be82ff" font-size="12" font-weight="bold" text-anchor="middle">exit_code() → contrato CLI</text>
  <text x="750" y="250" fill="#d6ebd0" font-size="11" text-anchor="middle">Lexical → 1 · Syntax → 2 · Type|Semantic → 3</text>
  <text x="750" y="272" fill="#789173" font-size="10" text-anchor="middle">la primera categoría del reporte decide el código</text>

  <line x1="480" y1="160" x2="562" y2="130" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="210" x2="562" y2="240" stroke="#78dc3c" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="30" y="318" fill="#789173" font-size="11">Type y Semantic se distinguen internamente pero comparten prefijo SEMANTIC y exit 3 — lo que exige el corrector automático</text>
</svg>
